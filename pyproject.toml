[project]
name = "chronos"
version = "0.5.0"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "icalendar>=7,<8", "python-dateutil>=2.9,<5", "tzdata"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
